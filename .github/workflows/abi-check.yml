name: ABI compatibility

on:
  pull_request:
    paths:
      - 'helix.h'
      - 'wrappers/swift/Sources/CHelix/helix.h'
      - 'helix.ld'
      - 'helix.exp'
      - 'helix.def'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/abi-check.yml'

jobs:
  abi-check:
    name: ABI (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    env:
      # The whole exported surface: 29 functions. 1.5 was the last ABI minor
      # to add one; 1.6 and 1.7 changed struct fields only. Kept here, not
      # read from helix.def / helix.ld, so that adding an export means
      # editing this check on purpose.
      HELIX_EXPORTS: >-
        helix_abi_version helix_chat_completions helix_chat_completions_stream
        helix_count_tokens helix_embeddings helix_free helix_last_error_json
        helix_model_describe helix_model_describe_copy helix_model_embedding_dim
        helix_model_hidden_dim helix_model_load helix_model_load_ex helix_model_release
        helix_rerank helix_runtime_create helix_runtime_describe
        helix_runtime_describe_copy helix_runtime_destroy helix_session_cancel
        helix_session_create helix_session_describe helix_session_destroy
        helix_session_encode helix_session_restore helix_session_save
        helix_set_log_callback helix_tokenize helix_version_string
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            runner: ubuntu-latest
          - label: windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Swift package vends its own copy of the public header (SwiftPM
      # cannot reach outside the package root). Keep it identical.
      - name: Swift wrapper header matches helix.h
        if: runner.os == 'Linux'
        run: diff -u helix.h wrappers/swift/Sources/CHelix/helix.h

      # ============================================================ #
      #  Linux: deep ABI compliance + symbol/node verification       #
      # ============================================================ #
      # The abi-compliance-checker comparison needs a published v1.0.0
      # baseline artefact on GitHub Releases. Disabled (if: false) until one
      # is uploaded; the symbol-set and version-node checks below still run.
      - name: Install tools
        if: false
        run: sudo apt-get install -y abi-compliance-checker abi-dumper

      - name: Download v1.0.0 baseline artefact
        if: false
        run: |
          curl -fsSL -o baseline.tar.xz \
            https://github.com/anemoi-ai/helix/releases/download/v1.0.0/libhelix-1.0.0-linux-x86_64-cpu.tar.xz
          tar xJf baseline.tar.xz

      - name: Dump baseline ABI
        if: false
        run: |
          abi-dumper libhelix-1.0.0/lib/libhelix.so.1 \
            -o baseline.dump \
            -lver 1.0.0 \
            -public-headers libhelix-1.0.0/include

      - name: Build current (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build \
            -DHELIX_BACKEND=cpu \
            -DHELIX_BUILD_TESTS=OFF \
            -DHELIX_BUILD_TOOLS=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel $(nproc)

      - name: Dump current ABI
        if: false
        run: |
          abi-dumper build/libhelix.so.1.*.* \
            -o current.dump \
            -lver "$(git describe --tags --always)" \
            -public-headers helix.h

      - name: Compare ABI
        if: false
        run: |
          abi-compliance-checker \
            -l helix \
            -old baseline.dump \
            -new current.dump \
            -strict

      # binutils >= 2.37 prints each symbol as name@@VERSION by default;
      # --with-symbol-versions makes older nm do the same, so the output has
      # one shape everywhere. The set check strips the version; the node
      # check below reads it.
      - name: Verify symbol set (Linux)
        if: runner.os == 'Linux'
        run: |
          ACTUAL=$(nm -D --defined-only --with-symbol-versions build/libhelix.so.1.*.* |
                   awk '{print $3}' | grep '^helix_' | sed 's/@.*//' | sort)
          EXPECTED=$(echo $HELIX_EXPORTS | tr ' ' '\n' | sort)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: exported symbol set differs from the 29-symbol surface"
            diff <(echo "$EXPECTED") <(echo "$ACTUAL") | sed -n 's/^</  missing:/p; s/^>/  extra:  /p'
            exit 1
          fi
          echo "OK: 29 symbols exactly"

      - name: Verify version nodes (Linux)
        if: runner.os == 'Linux'
        run: |
          # The frozen HELIX_1.0 node must still carry exactly the original
          # 16 symbols; each later node adds only its own symbols. @@ is the
          # default version, the one a newly linked binary binds to.
          BOUND=$(nm -D --defined-only --with-symbol-versions build/libhelix.so.1.*.* |
                  awk '{print $3}' | grep '^helix_')
          node() {
            ver=$1; shift
            for sym in "$@"; do
              echo "$BOUND" | grep -qx "${sym}@@HELIX_${ver}" || {
                echo "FAIL: $sym is not bound to HELIX_${ver}"
                echo "$BOUND" | grep "^${sym}@" | sed 's/^/  found: /'
                exit 1
              }
            done
          }
          node 1.0 helix_abi_version helix_chat_completions helix_chat_completions_stream \
            helix_free helix_last_error_json helix_model_describe helix_model_load \
            helix_model_release helix_runtime_create helix_runtime_describe \
            helix_runtime_destroy helix_session_cancel helix_session_create \
            helix_session_destroy helix_set_log_callback helix_version_string
          node 1.1 helix_embeddings helix_model_embedding_dim
          node 1.2 helix_session_describe
          node 1.3 helix_runtime_describe_copy helix_model_describe_copy \
            helix_session_encode helix_model_hidden_dim
          node 1.4 helix_count_tokens helix_tokenize helix_model_load_ex
          node 1.5 helix_session_save helix_session_restore helix_rerank
          echo "OK: HELIX_1.0 (16), 1.1 (2), 1.2 (1), 1.3 (4), 1.4 (3), 1.5 (3) nodes correct"

      # ============================================================ #
      #  Windows: build helix.dll + 29-symbol export verification    #
      # ============================================================ #
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 ^
            -DHELIX_BACKEND=cpu -DHELIX_BUILD_TESTS=OFF ^
            -DHELIX_BUILD_TOOLS=OFF -DCMAKE_BUILD_TYPE=Release
        shell: cmd

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel
        shell: cmd

      - name: Verify 29-symbol export surface (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Find helix.dll (output dir varies by generator/config)
          $dll = Get-ChildItem -Path build -Recurse -Filter "helix.dll" |
                 Select-Object -First 1
          if (-not $dll) { Write-Error "helix.dll not found"; exit 1 }

          # dumpbin is not on PATH outside a VS developer shell; ask vswhere.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * `
                       -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found via vswhere"; exit 1 }

          # Export rows are: ordinal, hint, RVA, name.
          $actual = & $dumpbin /exports $dll.FullName |
                    Select-String -Pattern '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(helix_\w+)\s*$' |
                    ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object
          $expected = $env:HELIX_EXPORTS -split '\s+' | Where-Object { $_ } | Sort-Object

          Write-Output "Found $($actual.Count) exported helix_ symbols:"
          $actual | ForEach-Object { Write-Output "  $_" }

          $diff = Compare-Object -ReferenceObject $expected -DifferenceObject @($actual)
          if ($diff) {
            $diff | ForEach-Object {
              $what = if ($_.SideIndicator -eq '<=') { 'missing' } else { 'extra' }
              Write-Output "  ${what}: $($_.InputObject)"
            }
            Write-Error "exported symbol set differs from the 29-symbol surface"
            exit 1
          }
          Write-Output "OK: 29 symbols exactly"
